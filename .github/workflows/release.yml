name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin ctx --bin ctx-server

      - name: package release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          archive="ctx-${version}-${target}.tar.gz"

          mkdir -p dist/package
          cp "target/${target}/release/ctx" dist/package/
          cp "target/${target}/release/ctx-server" dist/package/
          cp README.md LICENSE dist/package/

          tar -C dist/package -czf "dist/${archive}" ctx ctx-server README.md LICENSE
          (
            cd dist
            shasum -a 256 "${archive}" > "${archive}.sha256"
          )

      - name: build deb package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          cargo install cargo-deb --locked
          cargo deb --no-build --target x86_64-unknown-linux-gnu --output "dist/ctx_${version}_amd64.deb"

          (
            cd dist
            shasum -a 256 "ctx_${version}_amd64.deb" > "ctx_${version}_amd64.deb.sha256"
          )

      - name: upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_REPO: satoricorp/homebrew-tap
      APT_REPO: satoricorp/ctx-apt

    steps:
      - uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: generate homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          linux_sha="$(awk '{print $1}' "dist/ctx-${version}-x86_64-unknown-linux-gnu.tar.gz.sha256")"
          macos_intel_sha="$(awk '{print $1}' "dist/ctx-${version}-x86_64-apple-darwin.tar.gz.sha256")"
          macos_arm_sha="$(awk '{print $1}' "dist/ctx-${version}-aarch64-apple-darwin.tar.gz.sha256")"

          scripts/render-homebrew-formula.sh \
            --version "${version}" \
            --linux-sha "${linux_sha}" \
            --macos-intel-sha "${macos_intel_sha}" \
            --macos-arm-sha "${macos_arm_sha}" \
            > dist/ctx.rb

      - name: validate packaging secrets
        env:
          PACKAGING_REPO_TOKEN: ${{ secrets.PACKAGING_REPO_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "${PACKAGING_REPO_TOKEN}" || (echo "missing secret PACKAGING_REPO_TOKEN" && exit 1)
          test -n "${APT_GPG_PRIVATE_KEY}" || (echo "missing secret APT_GPG_PRIVATE_KEY" && exit 1)

      - name: create github release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGING_REPO_TOKEN }}
        with:
          files: dist/*
          generate_release_notes: true

      - name: checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.PACKAGING_REPO_TOKEN }}
          path: homebrew-tap

      - name: publish homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          mkdir -p homebrew-tap/Formula
          cp dist/ctx.rb homebrew-tap/Formula/ctx.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --short)" ]]; then
            git add Formula/ctx.rb
            git commit -m "ctx ${version}"
            git push origin HEAD:main
          fi

      - name: install apt repo tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: checkout apt repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APT_REPO }}
          token: ${{ secrets.PACKAGING_REPO_TOKEN }}
          path: ctx-apt

      - name: import apt signing key
        id: apt-key
        shell: bash
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "gnupghome=$GNUPGHOME" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: publish apt repository
        shell: bash
        env:
          GNUPGHOME: ${{ steps.apt-key.outputs.gnupghome }}
          APT_GPG_KEY_ID: ${{ steps.apt-key.outputs.fingerprint }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          scripts/build-apt-repo.sh \
            --repo-dir ctx-apt \
            --deb "dist/ctx_${version}_amd64.deb" \
            --keyring-out ctx-apt/ctx-archive-keyring.gpg \
            --signing-key "$APT_GPG_KEY_ID"

          cd ctx-apt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --short)" ]]; then
            git add .
            git commit -m "ctx ${version}"
            git push origin HEAD:main
          fi
