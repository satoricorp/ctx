<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wash" x1="55" y1="-35" x2="1550" y2="1210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.28" stop-color="#565656"/>
      <stop offset="0.57" stop-color="#242424"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="bright-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 265) rotate(42) scale(580 460)">
      <stop stop-color="#9a9a9a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9a9a9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bright-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1220 180) rotate(129) scale(540 430)">
      <stop stop-color="#777" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#777" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mid-bottom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 880) rotate(24) scale(640 420)">
      <stop stop-color="#696969" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#696969" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dark-corner" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1460 960) rotate(154) scale(560 360)">
      <stop stop-color="#050505" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="1.9" numOctaves="6" stitchTiles="stitch" result="grain"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.08 0.95"/>
        <feFuncG type="table" tableValues="0.08 0.95"/>
        <feFuncB type="table" tableValues="0.08 0.95"/>
        <feFuncA type="table" tableValues="0.18 0.78"/>
      </feComponentTransfer>
    </filter>
    <filter id="speckle" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="3.8" numOctaves="2" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="1.9 0 0 0 -0.45 0 1.9 0 0 -0.45 0 0 1.9 0 -0.45 0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.9"/>
      </feComponentTransfer>
    </filter>
    <filter id="soften">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#wash)"/>
  <rect width="1600" height="1200" fill="url(#bright-left)" filter="url(#soften)"/>
  <rect width="1600" height="1200" fill="url(#bright-right)" filter="url(#soften)"/>
  <rect width="1600" height="1200" fill="url(#mid-bottom)" filter="url(#soften)"/>
  <rect width="1600" height="1200" fill="url(#dark-corner)" filter="url(#soften)"/>
  <rect width="1600" height="1200" fill="#000" opacity="0.18"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity="0.92" style="mix-blend-mode:overlay"/>
  <rect width="1600" height="1200" filter="url(#speckle)" opacity="0.34" style="mix-blend-mode:multiply"/>
</svg>
