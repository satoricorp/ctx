[package]
name = "ctx"
version = "0.1.9"
edition = "2021"
description = "Local context for agents and humans"
license = "AGPL-3.0-only"
repository = "https://github.com/satoricorp/ctx"
homepage = "https://github.com/satoricorp/ctx"
readme = "README.md"
keywords = ["agents", "context", "memory", "mcp", "notes"]
categories = ["command-line-utilities"]

[[bin]]
name = "ctx"
path = "src/main.rs"

[[bin]]
name = "ctx-server"
path = "src/main_server.rs"

[package.metadata.deb]
maintainer = "Satori Engineering Co."
copyright = "2026, Satori Engineering Co."
license-file = ["LICENSE", "4"]
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
ctx is local context for agents and humans.
It stores markdown notes and local retrieval indices in a context artifact
that you can use through the CLI, MCP, or installable skills.
"""
assets = [
  ["target/release/ctx", "usr/bin/ctx", "755"],
  ["target/release/ctx-server", "usr/bin/ctx-server", "755"],
  ["README.md", "usr/share/doc/ctx/README.md", "644"],
  ["LICENSE", "usr/share/doc/ctx/LICENSE", "644"],
]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
calamine = "0.34"
chrono = { version = "0.4", features = ["serde"] }
html2text = "0.16"
quick-xml = "0.39"
rtf-parser = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
dirs = "5"
encoding_rs = "0.8.35"
futures = "0.3"
# Vendored helix-db (upstream: github.com/HelixDB/helix-db); path dep silences chatty migration println!s.
helix-db = { path = "vendor/helix/helix-db", default-features = false, features = ["server"] }
indicatif = "0.17"
open = "5"
pdf-extract = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rmcp = { version = "1.4.0", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zstd = "0.13"
chardetng = "1.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
