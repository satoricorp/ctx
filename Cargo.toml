[package]
name = "ctx"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ctx"
path = "src/main.rs"

[[bin]]
name = "ctx-server"
path = "src/main_server.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
encoding_rs = "0.8.35"
fastembed = { version = "5.13.2", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
# crates.io helix-db failed to compile cleanly here; track upstream until a fixed release lands.
helix-db = { git = "https://github.com/HelixDB/helix-db", default-features = false, features = ["server"] }
llama-cpp-2 = "0.1.138"
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rmcp = { version = "1.4.0", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
sysinfo = "0.30"
tar = "0.4"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zstd = "0.13"
